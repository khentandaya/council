appId: com.council.app
productName: Council
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
extraResources:
  - from: resources
    to: .
    filter: ['*.png']
# the Agent SDK spawns helper processes; keep it outside the asar archive
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk/**
win:
  target: nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Council
